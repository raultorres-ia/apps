<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repàs de cap de setmana</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><p class="eyebrow">4t de primària</p><h1>Missió nombres i càlcul</h1><p id="task-label"></p><p class="creator" id="creator"></p></header>
<section class="level" aria-label="Tria el nivell"><button data-level="ordinary" class="active">Nivell ordinari</button><button data-level="support">Itinerari guiat</button></section>
<section class="status"><div class="bar"><span id="bar"></span></div><p id="progress">Repte 1 de 5</p></section>
<section id="game" class="card" aria-live="polite"></section>
<section id="feedback" class="feedback" aria-live="assertive"></section>
<div class="actions"><button id="check">Comprova</button><button id="next" hidden>Repte següent</button><button id="restart" class="ghost">Torna a començar</button></div></main>
<script>window.TASK_LABEL = 'Tasca 2'; window.CREATOR = 'Raül Torres';</script><script src="script.js"></script></body></html>
